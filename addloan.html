<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyKisht - Add Loan</title>

    <link rel="stylesheet" href="kisht.css">

    <style>

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-light);
            color: var(--text);
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group select option {
            background: #101a33;
            color: white;
        }

        .loan-summary {
            margin: 20px 0;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card-light);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 7px 0;
            color: var(--muted);
        }

        .summary-row strong {
            color: var(--text);
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: rgba(25, 211, 162, 0.12);
            color: var(--green);
        }

        .message.error {
            display: block;
            background: rgba(255, 70, 70, 0.12);
            color: #ff6b6b;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .loading-text {
            color: var(--muted);
            font-size: 13px;
            margin-top: 7px;
        }

    </style>

</head>


<body>


<div class="page">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            ₹
        </div>

        <div>

            <h1>MyKisht</h1>

            <p>
                Simple. Secure. Organized.
            </p>

        </div>

    </div>


    <!-- CARD -->

    <div class="login-card">


        <div class="welcome-icon">
            💰
        </div>


        <h2>
            Add Loan
        </h2>


        <p class="subtitle">
            Create a new loan and automatically generate its EMI schedule.
        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- FORM -->

        <form
            id="loanForm"
            onsubmit="addLoan(event)"
        >


            <!-- CUSTOMER -->

            <div class="form-group">

                <label for="customer">
                    Select Customer
                </label>


                <select
                    id="customer"
                    required
                >

                    <option value="">
                        Loading customers...
                    </option>

                </select>


                <div
                    id="customerLoading"
                    class="loading-text"
                >
                    Customers load ho rahe hain...
                </div>

            </div>


            <!-- LOAN AMOUNT -->

            <div class="form-group">

                <label for="loanAmount">
                    Loan Amount (₹)
                </label>


                <input
                    type="number"
                    id="loanAmount"
                    placeholder="Example: 10000"
                    min="1"
                    step="0.01"
                    required
                    oninput="calculateLoan()"
                >

            </div>


            <!-- INTEREST -->

            <div class="form-group">

                <label for="interestRate">
                    Interest Rate (%)
                </label>


                <input
                    type="number"
                    id="interestRate"
                    placeholder="Example: 5"
                    min="0"
                    step="0.01"
                    required
                    oninput="calculateLoan()"
                >

            </div>


            <!-- EMI -->

            <div class="form-group">

                <label for="emiAmount">
                    Installment Amount (₹)
                </label>


                <input
                    type="number"
                    id="emiAmount"
                    placeholder="Example: 120"
                    min="1"
                    step="0.01"
                    required
                    oninput="calculateLoan()"
                >

            </div>


            <!-- FREQUENCY -->

            <div class="form-group">

                <label for="frequency">
                    Installment Frequency
                </label>


                <select
                    id="frequency"
                    required
                >

                    <option value="daily">
                        Daily
                    </option>

                    <option value="weekly">
                        Weekly
                    </option>

                    <option value="monthly">
                        Monthly
                    </option>

                </select>

            </div>


            <!-- START DATE -->

            <div class="form-group">

                <label for="startDate">
                    Start Date
                </label>


                <input
                    type="date"
                    id="startDate"
                    required
                >

            </div>


            <!-- SUMMARY -->

            <div class="loan-summary">


                <div class="summary-row">

                    <span>
                        Interest Amount
                    </span>

                    <strong id="interestAmount">
                        ₹0.00
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Total Payable
                    </span>

                    <strong id="totalPayable">
                        ₹0.00
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Total Installments
                    </span>

                    <strong id="totalInstallments">
                        0
                    </strong>

                </div>


            </div>


            <!-- CREATE -->

            <button
                type="submit"
                class="primary-btn"
                id="saveBtn"
            >
                Create Loan
            </button>


        </form>


        <!-- BACK -->

        <button
            type="button"
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Dashboard
        </button>


    </div>


    <footer>

        <p>
            © 2026 MyKisht. All rights reserved.
        </p>

    </footer>


</div>



<script>


// =====================================================
// API
// =====================================================

const API_URL = "http://localhost:5000";


// =====================================================
// TOKEN
// =====================================================

const token =
    localStorage.getItem("mykisht_token") ||
    localStorage.getItem("myKishtToken");


// =====================================================
// ROLE
// =====================================================

const role =
    localStorage.getItem("mykisht_role") ||
    localStorage.getItem("myKishtRole");


// =====================================================
// AUTH CHECK
// =====================================================

if (
    !token ||
    !["admin", "owner"].includes(role)
) {

    window.location.href = "owner.html";

}


// =====================================================
// API RESPONSE HANDLER
// =====================================================

async function readResponse(response) {

    const contentType =
        response.headers.get("content-type") || "";


    if (
        contentType.includes(
            "application/json"
        )
    ) {

        return await response.json();

    }


    const text =
        await response.text();


    return {
        success: false,
        message:
            text ||
            `Server error (${response.status})`
    };

}


// =====================================================
// LOAD CUSTOMERS
// =====================================================

async function loadCustomers() {


    const customerSelect =
        document.getElementById(
            "customer"
        );


    const loadingText =
        document.getElementById(
            "customerLoading"
        );


    try {


        customerSelect.innerHTML = `

            <option value="">
                Loading customers...
            </option>

        `;


        const response =
            await fetch(

                `${API_URL}/api/admin/customers`,

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json"

                    }

                }

            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(

                data.message ||
                `Unable to load customers (${response.status})`

            );

        }


        let customers =
            data.customers ||
            data.data ||
            [];


        if (!Array.isArray(customers)) {

            customers = [];

        }


        customerSelect.innerHTML = `

            <option value="">
                Select Customer
            </option>

        `;


        if (customers.length === 0) {


            customerSelect.innerHTML += `

                <option value="">
                    No customers found
                </option>

            `;


            loadingText.textContent =
                "Pehle customer add karein.";


            return;

        }


        customers.forEach(
            function(customer) {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    customer.id;


                const name =
                    customer.full_name ||
                    customer.name ||
                    "Customer";


                const mobile =
                    customer.mobile ||
                    "";


                option.textContent =
                    mobile
                        ? `${name} - ${mobile}`
                        : name;


                customerSelect.appendChild(
                    option
                );


            }
        );


        loadingText.textContent =
            `${customers.length} customer available`;


    } catch (error) {


        console.error(
            "Customer loading error:",
            error
        );


        customerSelect.innerHTML = `

            <option value="">
                Failed to load customers
            </option>

        `;


        loadingText.textContent =
            "Customer load nahi ho paye.";


        showMessage(
            error.message ||
            "Unable to load customers.",
            "error"
        );

    }

}


// =====================================================
// CALCULATE LOAN
// =====================================================

function calculateLoan() {


    const loanAmount =
        Number(
            document.getElementById(
                "loanAmount"
            ).value
        ) || 0;


    const interestRate =
        Number(
            document.getElementById(
                "interestRate"
            ).value
        ) || 0;


    const emiAmount =
        Number(
            document.getElementById(
                "emiAmount"
            ).value
        ) || 0;


    const interest =
        loanAmount *
        interestRate /
        100;


    const total =
        loanAmount +
        interest;


    const installments =
        emiAmount > 0
            ? Math.ceil(
                total /
                emiAmount
            )
            : 0;


    document.getElementById(
        "interestAmount"
    ).textContent =
        formatMoney(
            interest
        );


    document.getElementById(
        "totalPayable"
    ).textContent =
        formatMoney(
            total
        );


    document.getElementById(
        "totalInstallments"
    ).textContent =
        installments;

}


// =====================================================
// CREATE LOAN
// =====================================================

async function addLoan(event) {


    event.preventDefault();


    const customerId =
        document.getElementById(
            "customer"
        ).value;


    const loanAmount =
        Number(
            document.getElementById(
                "loanAmount"
            ).value
        );


    const interestRate =
        Number(
            document.getElementById(
                "interestRate"
            ).value
        );


    const emiAmount =
        Number(
            document.getElementById(
                "emiAmount"
            ).value
        );


    const frequency =
        document.getElementById(
            "frequency"
        ).value;


    const startDate =
        document.getElementById(
            "startDate"
        ).value;


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    // =================================================
    // VALIDATION
    // =================================================

    if (!customerId) {

        showMessage(
            "Please select a customer.",
            "error"
        );

        return;

    }


    if (
        !Number.isFinite(
            loanAmount
        ) ||
        loanAmount <= 0
    ) {

        showMessage(
            "Loan amount must be greater than 0.",
            "error"
        );

        return;

    }


    if (
        !Number.isFinite(
            interestRate
        ) ||
        interestRate < 0
    ) {

        showMessage(
            "Interest rate cannot be negative.",
            "error"
        );

        return;

    }


    if (
        !Number.isFinite(
            emiAmount
        ) ||
        emiAmount <= 0
    ) {

        showMessage(
            "Installment amount must be greater than 0.",
            "error"
        );

        return;

    }


    if (!startDate) {

        showMessage(
            "Please select start date.",
            "error"
        );

        return;

    }


    // =================================================
    // BUTTON
    // =================================================

    saveBtn.disabled = true;

    saveBtn.textContent =
        "Creating Loan...";


    try {


        // =================================================
        // CREATE LOAN API
        // =================================================

        const response =
            await fetch(

                `${API_URL}/api/loans`,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`

                    },

                    body: JSON.stringify({

                        customerId:
                            Number(
                                customerId
                            ),

                        loanAmount:
                            loanAmount,

                        interestRate:
                            interestRate,

                        emiAmount:
                            emiAmount,

                        frequency:
                            frequency,

                        startDate:
                            startDate

                    })

                }

            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(

                data.message ||
                `Loan creation failed (${response.status})`

            );

        }


        // =================================================
        // SUCCESS
        // =================================================

        showMessage(

            data.message ||
            "Loan created successfully! EMI schedule generated.",

            "success"

        );


        // =================================================
        // RESET
        // =================================================

        document.getElementById(
            "loanForm"
        ).reset();


        setTodayDate();


        calculateLoan();


        // =================================================
        // REDIRECT
        // =================================================

        setTimeout(

            function() {

                window.location.href =
                    "./ownerdashbord.html";

            },

            1200

        );


    } catch (error) {


        console.error(
            "Create loan error:",
            error
        );


        showMessage(

            error.message ||
            "Something went wrong while creating loan.",

            "error"

        );


    } finally {


        saveBtn.disabled = false;

        saveBtn.textContent =
            "Create Loan";

    }

}


// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(amount) {


    return "₹" +

        Number(
            amount || 0
        ).toLocaleString(

            "en-IN",

            {

                minimumFractionDigits: 2,

                maximumFractionDigits: 2

            }

        );

}


// =====================================================
// SHOW MESSAGE
// =====================================================

function showMessage(
    text,
    type
) {


    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        `message ${type}`;


    message.style.display =
        "block";


    if (type === "success") {

        message.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }

}


// =====================================================
// BACK
// =====================================================

function goBack() {

    window.location.href =
        "./ownerdashbord.html";

}


// =====================================================
// TODAY DATE
// =====================================================

function setTodayDate() {


    const date =
        new Date();


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "startDate"
    ).value =
        `${year}-${month}-${day}`;

}


// =====================================================
// START
// =====================================================

setTodayDate();

calculateLoan();

loadCustomers();


</script>


</body>

</html>
