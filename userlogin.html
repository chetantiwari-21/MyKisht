<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyKisht - User Login</title>

    <link rel="stylesheet" href="kisht.css">
</head>


<body>

<div class="page">

    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            ₹
        </div>

        <div>

            <h1>MyKisht</h1>

            <p>
                Simple. Secure. Organized.
            </p>

        </div>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <div class="welcome-icon">
            👤
        </div>


        <h2 id="cardTitle">
            User Login
        </h2>


        <p
            class="subtitle"
            id="cardSubtitle"
        >
            Login to check your loan and installments.
        </p>


        <!-- ================================================= -->
        <!-- LOGIN FORM -->
        <!-- ================================================= -->

        <form
            id="loginForm"
            onsubmit="loginUser(event)"
        >

            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="primary-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <!-- CREATE ACCOUNT -->

        <p
            class="bottom-text"
            id="createAccountBox"
        >

            Don't have an account?

            <button
                type="button"
                class="link-btn"
                onclick="createAccount()"
            >
                Create Account
            </button>

        </p>


        <!-- FORGOT -->

        <button
            type="button"
            class="link-btn"
            id="forgotBtn"
            onclick="forgotPassword()"
        >
            Forgot Password?
        </button>


        <!-- BACK -->

        <button
            type="button"
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>

    </div>


    <footer>

        <p>
            © 2026 MyKisht. All rights reserved.
        </p>

    </footer>

</div>



<script>


// ======================================================
// BACKEND URL
// ======================================================

const API_URL = "http://const API_URL = "https://mykisht-backend.onrender.com";


// ======================================================
// FORGOT PASSWORD VARIABLES
// ======================================================

let resetMobile = "";

let resetToken = "";


// ======================================================
// PASSWORD SHOW / HIDE
// ======================================================

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".password-toggle");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "🙈";

    } else {

        password.type = "password";

        button.textContent = "👁";

    }

}


// ======================================================
// USER LOGIN
// ======================================================

async function loginUser(event) {

    event.preventDefault();


    const mobile =
        document
            .getElementById("mobile")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const loginBtn =
        document.getElementById("loginBtn");


    if (!/^[0-9]{10}$/.test(mobile)) {

        showMessage(
            "Please enter a valid 10 digit mobile number.",
            "error"
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Please enter a valid password.",
            "error"
        );

        return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
        "Logging in...";


    try {

        const response = await fetch(
            `${API_URL}/api/auth/customer/login`,
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    mobile: mobile,

                    password: password

                })

            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message || "Login failed.",
                "error"
            );

            return;

        }


        if (!data.token) {

            showMessage(
                "Login successful, but token was not received.",
                "error"
            );

            return;

        }


        localStorage.setItem(
            "mykisht_token",
            data.token
        );


        localStorage.setItem(
            "mykisht_user",
            JSON.stringify(
                data.user ||
                data.customer ||
                {}
            )
        );


        localStorage.setItem(
            "mykisht_role",
            "customer"
        );


        // Old keys

        localStorage.setItem(
            "myKishtToken",
            data.token
        );


        localStorage.setItem(
            "myKishtUser",
            JSON.stringify(
                data.user ||
                data.customer ||
                {}
            )
        );


        localStorage.setItem(
            "myKishtRole",
            "customer"
        );


        showMessage(
            "Login successful!",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "user dashboard.html";

        }, 700);


    } catch (error) {

        console.error(
            "Login error:",
            error
        );


        showMessage(
            "Backend server se connection nahi ho pa raha.",
            "error"
        );


    } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
            "Login";

    }

}


// ======================================================
// CREATE ACCOUNT
// ======================================================

function createAccount() {

    window.location.href =
        "user egister.html";

}


// ======================================================
// FORGOT PASSWORD - STEP 1
// ======================================================

function forgotPassword() {

    resetMobile = "";

    resetToken = "";


    document.getElementById("cardTitle").textContent =
        "Forgot Password";


    document.getElementById("cardSubtitle").textContent =
        "Enter your registered mobile number.";


    document.getElementById("loginForm").innerHTML = `

        <div class="form-group">

            <label for="resetMobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="resetMobile"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                inputmode="numeric"
                required
            >

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button
            type="submit"
            class="primary-btn"
            id="sendOtpBtn"
        >
            Send OTP
        </button>

    `;


    document.getElementById("loginForm")
        .onsubmit = function(event) {

            event.preventDefault();

            sendOTP();

        };


    document.getElementById("createAccountBox")
        .style.display = "none";


    document.getElementById("forgotBtn")
        .style.display = "none";


    const mobileInput =
        document.getElementById("resetMobile");


    mobileInput.addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .replace(/[^0-9]/g, "")
                    .slice(0, 10);

        }
    );

}


// ======================================================
// SEND OTP
// ======================================================

async function sendOTP() {

    const mobile =
        document
            .getElementById("resetMobile")
            .value
            .trim();


    const button =
        document.getElementById("sendOtpBtn");


    if (!/^[0-9]{10}$/.test(mobile)) {

        showMessage(
            "Please enter a valid 10 digit mobile number.",
            "error"
        );

        return;

    }


    resetMobile = mobile;


    button.disabled = true;

    button.textContent =
        "Sending OTP...";


    try {

        const response =
            await fetch(
                `${API_URL}/api/auth/forgot-password/send-otp`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        mobile: mobile

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Unable to send OTP.",
                "error"
            );

            return;

        }


        // Development mode mein backend OTP return karega

        if (data.development_otp) {

            showMessage(
                `OTP: ${data.development_otp}`,
                "success"
            );

        } else {

            showMessage(
                "OTP sent successfully.",
                "success"
            );

        }


        setTimeout(() => {

            showOTPPage(
                data.development_otp || ""
            );

        }, 800);


    } catch (error) {

        console.error(
            "Send OTP error:",
            error
        );


        showMessage(
            "Backend server se connection nahi ho pa raha.",
            "error"
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "Send OTP";

    }

}


// ======================================================
// FORGOT PASSWORD - STEP 2 OTP
// ======================================================

function showOTPPage(developmentOTP) {

    document.getElementById("cardTitle").textContent =
        "Verify OTP";


    document.getElementById("cardSubtitle").textContent =
        `OTP sent to ${resetMobile}`;


    document.getElementById("loginForm").innerHTML = `

        <div class="form-group">

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="tel"
                id="otp"
                placeholder="Enter 6 digit OTP"
                maxlength="6"
                inputmode="numeric"
                required
            >

        </div>


        <div
            id="message"
            class="message"
        ></div>

        <div
            id="otpDisplay"
            class="message success"
            style="display: none; text-align: center; font-size: 20px; font-weight: 700;"
        ></div>


        <button
            type="submit"
            class="primary-btn"
            id="verifyOtpBtn"
        >
            Verify OTP
        </button>


        <button
            type="button"
            class="link-btn"
            onclick="forgotPassword()"
        >
            Change Mobile Number
        </button>

    `;


    document.getElementById("loginForm")
        .onsubmit = function(event) {

            event.preventDefault();

            verifyOTP();

        };


    const otpInput =
        document.getElementById("otp");


    otpInput.addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .replace(/[^0-9]/g, "")
                    .slice(0, 6);

        }
    );


    // Keep the development OTP visible on the OTP screen for 30 seconds.

    if (developmentOTP) {

        const otpDisplay =
            document.getElementById("otpDisplay");

        let secondsLeft = 30;

        otpDisplay.style.display = "block";
        otpDisplay.textContent =
            `OTP: ${developmentOTP} - ${secondsLeft}s remaining`;

        const otpTimer =
            setInterval(() => {
                secondsLeft -= 1;

                if (secondsLeft <= 0) {
                    clearInterval(otpTimer);
                    otpDisplay.textContent =
                        "OTP display ended. The OTP remains valid for a limited time.";
                    return;
                }

                otpDisplay.textContent =
                    `OTP: ${developmentOTP} - ${secondsLeft}s remaining`;
            }, 1000);

        console.log(
            "🔐 MyKisht OTP:",
            developmentOTP
        );

    }

}


// ======================================================
// VERIFY OTP
// ======================================================

async function verifyOTP() {

    const otp =
        document
            .getElementById("otp")
            .value
            .trim();


    const button =
        document.getElementById("verifyOtpBtn");


    if (!/^[0-9]{6}$/.test(otp)) {

        showMessage(
            "Please enter the 6 digit OTP.",
            "error"
        );
        return;

    }


    button.disabled = true;

    button.textContent =
        "Verifying...";


    try {

        const response =
            await fetch(
                `${API_URL}/api/auth/forgot-password/verify-otp`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        mobile:
                            resetMobile,

                        otp:
                            otp

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Invalid OTP.",
                "error"
            );

            return;

        }


        resetToken =
            data.reset_token;


        showMessage(
            "OTP verified successfully.",
            "success"
        );


        setTimeout(() => {

            showNewPasswordPage();

        }, 700);


    } catch (error) {

        console.error(
            "Verify OTP error:",
            error
        );


        showMessage(
            "Backend server se connection nahi ho pa raha.",
            "error"
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "Verify OTP";

    }

}


// ======================================================
// FORGOT PASSWORD - STEP 3
// ======================================================

function showNewPasswordPage() {

    document.getElementById("cardTitle").textContent =
        "Create New Password";


    document.getElementById("cardSubtitle").textContent =
        "Enter your new password below.";


    document.getElementById("loginForm").innerHTML = `

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="toggleNewPassword('newPassword', this)"
                >
                    👁
                </button>

            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="toggleNewPassword('confirmPassword', this)"
                >
                    👁
                </button>

            </div>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button
            type="submit"
            class="primary-btn"
            id="resetPasswordBtn"
        >
            Change Password
        </button>

    `;


    document.getElementById("loginForm")
        .onsubmit = function(event) {

            event.preventDefault();

            resetPassword();

        };

}


// ======================================================
// NEW PASSWORD SHOW / HIDE
// ======================================================

function toggleNewPassword(
    inputId,
    button
) {

    const input =
        document.getElementById(inputId);


    if (input.type === "password") {

        input.type = "text";

        button.textContent =
            "🙈";

    } else {

        input.type = "password";

        button.textContent =
            "👁";

    }

}


// ======================================================
// RESET PASSWORD
// ======================================================

async function resetPassword() {

    const newPassword =
        document
            .getElementById("newPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    const button =
        document.getElementById(
            "resetPasswordBtn"
        );


    if (newPassword.length < 6) {

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    if (
        newPassword !==
        confirmPassword
    ) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    if (!resetToken) {

        showMessage(
            "Password reset session expired. Please try again.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Changing Password...";


    try {

        const response =
            await fetch(
                `${API_URL}/api/auth/forgot-password/reset-password`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        mobile:
                            resetMobile,

                        resetToken:
                            resetToken,

                        newPassword:
                            newPassword

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Unable to change password.",
                "error"
            );

            return;

        }


        showMessage(
            "Password changed successfully! Please login.",
            "success"
        );


        resetToken = "";


        setTimeout(() => {

            location.reload();

        }, 1500);


    } catch (error) {

        console.error(
            "Reset password error:",
            error
        );


        showMessage(
            "Backend server se connection nahi ho pa raha.",
            "error"
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "Change Password";

    }

}


// ======================================================
// BACK
// ======================================================

function goBack() {

    window.location.href =
        "my kisht.html";

}


// ======================================================
// MESSAGE
// ======================================================

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    if (!message) {
        return;
    }


    message.textContent =
        text;


    message.className =
        `message ${type}`;

}


// ======================================================
// MOBILE ONLY NUMBERS
// ======================================================

document
    .getElementById("mobile")
    .addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/[^0-9]/g, "")
                    .slice(0, 10);

        }
    );

</script>

</body>

</html>
