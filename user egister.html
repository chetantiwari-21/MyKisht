<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyKisht - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050816;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            background: #10152a;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
            border: 1px solid #252d4d;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #9b6cff;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #91a1c8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #dce2ff;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid #30395f;
            background: #080d1d;
            color: #ffffff;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #9b6cff;
            box-shadow: 0 0 0 2px rgba(155, 108, 255, 0.12);
        }

        input::placeholder {
            color: #667399;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #9b6cff, #23d4ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #91a1c8;
            font-size: 14px;
        }

        .login-link a {
            color: #23d4ff;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">MyKisht</div>

        <div class="subtitle">
            Create your customer account
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email (Optional)</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                >
            </div>

            <div class="form-group">
                <label for="address">Address (Optional)</label>
                <input
                    type="text"
                    id="address"
                    placeholder="Enter your address"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password"
                    required
                >
            </div>

            <button type="submit" id="registerBtn">
                Create Account
            </button>

            <div class="message" id="message"></div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="userlogin.html">Login</a>
        </div>

    </div>


    <script>

        // ==========================================
        // API URL
        // ==========================================

        const API_URL = "http://localhost:5000";


        // ==========================================
        // ELEMENTS
        // ==========================================

        const registerForm = document.getElementById("registerForm");
        const registerBtn = document.getElementById("registerBtn");
        const message = document.getElementById("message");


        // ==========================================
        // REGISTER USER
        // ==========================================

        registerForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value.trim();

            const mobile =
                document.getElementById("mobile").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // ==========================================
            // BASIC VALIDATION
            // ==========================================

            if (!fullName || !mobile || !password || !confirmPassword) {

                showMessage(
                    "Please fill all required fields.",
                    "error"
                );

                return;
            }


            if (!/^[0-9]{10}$/.test(mobile)) {

                showMessage(
                    "Enter a valid 10 digit mobile number.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            // ==========================================
            // DISABLE BUTTON
            // ==========================================

            registerBtn.disabled = true;
            registerBtn.textContent = "Creating Account...";

            showMessage("", "");


            try {

                // ==========================================
                // CORRECT BACKEND ENDPOINT
                // ==========================================

                const response = await fetch(
                    `${API_URL}/api/auth/customer/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: fullName,

                            mobile: mobile,

                            email: email || null,

                            address: address || null,

                            password: password

                        })
                    }
                );


                // ==========================================
                // CHECK RESPONSE
                // ==========================================

                const data = await response.json();


                if (!response.ok) {

                    showMessage(
                        data.message || "Unable to create account.",
                        "error"
                    );

                    return;
                }


                // ==========================================
                // SUCCESS
                // ==========================================

                showMessage(
                    "Account created successfully!",
                    "success"
                );


                // Save customer information if returned

                if (data.customer) {

                    localStorage.setItem(
                        "mykisht_customer",
                        JSON.stringify(data.customer)
                    );

                }


                // Go to login page

                setTimeout(() => {

                    window.location.href = "userlogin.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                showMessage(
                    "Backend server se connection nahi ho pa raha. Server check karo.",
                    "error"
                );

            } finally {

                registerBtn.disabled = false;

                registerBtn.textContent = "Create Account";

            }

        });


        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(text, type) {

            message.textContent = text;

            if (type === "success") {

                message.style.color = "#23d4ff";

            } else if (type === "error") {

                message.style.color = "#ff6b6b";

            } else {

                message.style.color = "#91a1c8";

            }

        }


        // ==========================================
        // ONLY NUMBERS IN MOBILE
        // ==========================================

        document
            .getElementById("mobile")
            .addEventListener("input", function () {

                this.value = this.value
                    .replace(/[^0-9]/g, "")
                    .slice(0, 10);

            });

    </script>

</body>
</html>
